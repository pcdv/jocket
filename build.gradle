import org.gradle.internal.os.OperatingSystem

plugins {
  id 'java-library'
  id 'ivy-publish'
  id 'maven-publish'
}

group = 'com.github.pcdv.jocket'

repositories {
  mavenCentral()
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(21)
  }
  withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8'
}

dependencies {
  testImplementation platform('org.junit:junit-bom:6.1.3')
  testImplementation 'org.junit.jupiter:junit-jupiter'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
  useJUnitPlatform()
  // a test stuck in a busy loop is abandoned (not just interrupted) and fails
  systemProperty 'junit.jupiter.execution.timeout.default', '2 m'
  systemProperty 'junit.jupiter.execution.timeout.thread.mode.default', 'SEPARATE_THREAD'
}

// The futex library is Linux-only. Elsewhere Jocket falls back on busy waiting.
def jniDir = layout.buildDirectory.dir('jni')
def jniHeaders = tasks.named('compileJava', JavaCompile).flatMap { it.options.headerOutputDirectory }
def jniJdk = javaToolchains.compilerFor(java.toolchain).map { it.metadata.installationPath.asFile.absolutePath }
def jniSource = file('src/main/c/jocket_futex_Futex.c')

def jni = tasks.register('jni', Exec) {
  description = 'Builds the JNI futex library (Linux only).'
  group = 'build'
  onlyIf('the futex library is Linux-only') { OperatingSystem.current().isLinux() }

  inputs.dir('src/main/c')
  inputs.dir(jniHeaders)
  outputs.dir(jniDir)

  // LibLoader looks for lib<name>64.so at the root of the classpath
  executable 'gcc'
  argumentProviders.add({
    def jdk = jniJdk.get()
    ['-O2', '-Wall', '-fPIC', '-shared',
     "-I${jniHeaders.get().asFile}", "-I${jdk}/include", "-I${jdk}/include/linux",
     '-o', jniDir.get().file('libJocketFutex64.so').asFile.absolutePath,
     jniSource.absolutePath]
  } as CommandLineArgumentProvider)

  doFirst {
    jniDir.get().asFile.mkdirs()
  }
}

tasks.named('processResources') {
  from(jni)
}

publishing {
  repositories {
    ivy {
      name = 'local'
      url = "${System.properties['user.home']}/.ivy2/local"
    }
  }
  publications {
    // allows to do a local publish
    ivy(IvyPublication) {
      organisation = project.group
      from components.java
    }

    // publishToMavenLocal (or jitpack.io) using -Pversion=x.y.z
    maven(MavenPublication) {
      from components.java
      pom {
        name = 'jocket'
        description = 'Low-latency replacement for local Java sockets, using shared memory'
        url = 'https://github.com/pcdv/jocket'
        licenses {
          license {
            name = 'Apache License, Version 2.0'
            url = 'https://www.apache.org/licenses/LICENSE-2.0'
          }
        }
        scm {
          url = 'https://github.com/pcdv/jocket'
        }
      }
    }
  }
}

jar {
  manifest {
    attributes 'Implementation-Title': project.name,
      'Implementation-Version': project.version
  }
}
